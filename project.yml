name: FlipperDashboard

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: false
    ENABLE_HARDENED_RUNTIME: false

targets:
  FlipperIRCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/FlipperIRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flipperdashboard.core
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true

  DashboardBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/DashboardBar
    dependencies:
      - target: FlipperIRCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flipperdashboard.app
        PRODUCT_NAME: Flipper Dashboard
        INFOPLIST_FILE: Resources/DashboardInfo.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

schemes:
  DashboardBar:
    build:
      targets:
        DashboardBar: all
    run:
      config: Debug
    archive:
      config: Release
